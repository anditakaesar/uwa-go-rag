all: false
# dir: "internal/mocks"
filename: "{{.InterfaceName}}.go"
force-file-write: true
formatter: goimports
include-auto-generated: false
log-level: info
structname: "{{.Mock}}{{.InterfaceName}}"
pkgname: "mocks"
recursive: false
require-template-schema-exists: true
template: testify
template-schema: "{{.Template}}.schema.json"
packages:
  github.com/anditakaesar/uwa-go-rag/internal/audit:
    config:
      dir: "internal/audit/mocks"
    interfaces:
      Recorder:
      Repository:
  github.com/anditakaesar/uwa-go-rag/internal/file:
    config:
      dir: "internal/file/mocks"
    interfaces:
      PasswordChecker:
      StorageClient:
      FileRepository:
      FileService:
  github.com/anditakaesar/uwa-go-rag/internal/infra/jwt:
    config:
      dir: "internal/infra/jwt/mocks"
    interfaces:
      PermissionRepo:
  github.com/anditakaesar/uwa-go-rag/internal/server:
    config:
      dir: "internal/server/mocks"
    interfaces:
      StorageClient:
      Database:
  github.com/anditakaesar/uwa-go-rag/internal/server/middlewares:
    config:
      dir: "internal/server/middlewares/mocks"
    interfaces:
      CookieService:
      JWTService:
      UserService:
  github.com/anditakaesar/uwa-go-rag/internal/user:
    config:
      dir: "internal/user/mocks"
    interfaces:
      UserRepository:
      PasswordChecker:
      FileRepository:
      UserService:
  github.com/anditakaesar/uwa-go-rag/internal/web:
    config:
      dir: "internal/web/mocks"
    interfaces:
      FileService:
      WebRenderer:
      UserService:
      JWTService:
      CookieService:
