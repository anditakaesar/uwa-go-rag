all: false
# dir: "internal/mocks"
filename: "{{.InterfaceName}}.go"
force-file-write: true
formatter: goimports
include-auto-generated: false
log-level: info
structname: "{{.Mock}}{{.InterfaceName}}"
pkgname: "mocks"
recursive: false
require-template-schema-exists: true
template: testify
template-schema: "{{.Template}}.schema.json"
packages:
  github.com/anditakaesar/uwa-go-rag/internal/audit:
    config:
      dir: "internal/audit/mocks"
    interfaces:
      Recorder:
      Repository:
  github.com/anditakaesar/uwa-go-rag/internal/chat:
    config:
      dir: "internal/chat/mocks"
    interfaces:
      RetrievalRepository:
      Embedder:
      LLMClient:
      UnansweredRecorder:
      ChatService:
  github.com/anditakaesar/uwa-go-rag/internal/faq:
    config:
      dir: "internal/faq/mocks"
    interfaces:
      Repository:
      FAQService:
      JobQueue:
  github.com/anditakaesar/uwa-go-rag/internal/file:
    config:
      dir: "internal/file/mocks"
    interfaces:
      PasswordChecker:
      StorageClient:
      FileRepository:
      FileService:
  github.com/anditakaesar/uwa-go-rag/internal/infra/jwt:
    config:
      dir: "internal/infra/jwt/mocks"
    interfaces:
      PermissionRepo:
  github.com/anditakaesar/uwa-go-rag/internal/infra/tokenization:
    config:
      dir: "internal/infra/tokenization/mocks"
    interfaces:
      Tokenizer:
  github.com/anditakaesar/uwa-go-rag/internal/rag:
    config:
      dir: "internal/rag/mocks"
    interfaces:
      ChunkRepository:
  github.com/anditakaesar/uwa-go-rag/internal/server:
    config:
      dir: "internal/server/mocks"
